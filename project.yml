name: ConceptsOnboarding
options:
  bundleIdPrefix: com.evgeniyraev
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ConceptsOnboarding:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - target: OrbitFamilyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgeniyraev.ConceptsOnboarding
        PRODUCT_NAME: Orbit Family
        PRODUCT_MODULE_NAME: ConceptsOnboarding
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist

  OrbitFamilyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgeniyraev.ConceptsOnboarding.watchkitapp
        PRODUCT_NAME: Orbit Family
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: watchOS/Info.plist

  ConceptsOnboardingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/PairingProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgeniyraev.ConceptsOnboardingTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ConceptsOnboarding:
    build:
      targets:
        ConceptsOnboarding: all
    run:
      config: Debug
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "0"
    test:
      config: Debug
      targets:
        - ConceptsOnboardingTests
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "0"
    profile:
      config: Release
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "0"
    management:
      orderHint: 0

  ConceptsOnboarding Diagnostics:
    build:
      targets:
        ConceptsOnboarding: all
    run:
      config: Debug
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "1"
    test:
      config: Debug
      targets:
        - ConceptsOnboardingTests
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "1"
    profile:
      config: Release
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "1"
    management:
      orderHint: 1

  OrbitFamilyWatch:
    build:
      targets:
        OrbitFamilyWatch: all
    run:
      config: Debug
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "0"
    profile:
      config: Release
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "0"
    management:
      orderHint: 2

  OrbitFamilyWatch Diagnostics:
    build:
      targets:
        OrbitFamilyWatch: all
    run:
      config: Debug
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "1"
    profile:
      config: Release
      environmentVariables:
        ORBIT_DIAGNOSTICS_ENABLED: "1"
    management:
      orderHint: 3
